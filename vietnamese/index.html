<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Flashcard Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2430;
    --paper:#faf7f0;
    --lacquer:#8a1f2b;
    --lacquer-dark:#6b1620;
    --gold:#c99a3c;
    --jade:#2f5d50;
    --line:#e4ddcd;
    --card-bg:#fffdf8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun','Noto Sans Thai','Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 32px;
  }
  header{
    width:100%;
    max-width:520px;
    text-align:center;
    margin-bottom:14px;
  }
  header .kicker{
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--jade);
    font-weight:600;
  }
  header h1{
    font-size:22px;
    margin:4px 0 0;
    font-weight:700;
    color:var(--lacquer-dark);
  }
  .controls-top{
    width:100%;
    max-width:520px;
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  select{
    flex:1;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--card-bg);
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
  }
  .progress{
    width:100%;
    max-width:520px;
    height:4px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--jade),var(--gold));
    transition:width .25s ease;
  }
  .card-wrap{
    width:100%;
    max-width:520px;
    perspective:1200px;
    margin-bottom:8px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:280px;
    border-radius:20px;
    background:var(--card-bg);
    border:1.5px solid var(--line);
    box-shadow:0 6px 24px rgba(107,22,32,0.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:transform .12s ease;
  }
  .card:active{ transform:scale(0.985); }
  .card::before{
    content:"";
    position:absolute;
    top:14px; left:14px; right:14px; bottom:14px;
    border:1px solid var(--gold);
    border-radius:14px;
    opacity:0.35;
    pointer-events:none;
  }
  .cat-label{
    font-size:12.5px;
    color:var(--lacquer);
    font-weight:700;
    letter-spacing:0.03em;
    margin-bottom:14px;
  }
  .front-text{
    font-weight:800;
    color:var(--ink);
    line-height:1;
    word-break:break-word;
  }
  .back-content{
    display:none;
    width:100%;
  }
  .back-content .front-echo{
    font-size:15px;
    color:#8a8578;
    margin-bottom:10px;
  }
  .back-line{
    font-size:19px;
    line-height:1.7;
    color:var(--ink);
  }
  .back-line b{ color:var(--lacquer-dark); }
  .flip-hint{
    margin-top:16px;
    font-size:12px;
    color:#a39c8a;
  }
  .counter{
    text-align:center;
    font-size:13px;
    color:#9b9384;
    margin:10px 0 20px;
  }
  .btn-row{
    width:100%;
    max-width:520px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .btn-row.secondary{
    grid-template-columns:1fr 1fr;
  }
  button{
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:14px 10px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:active{ opacity:0.7; }
  .btn-nav{
    background:var(--card-bg);
    border:1.5px solid var(--line);
    color:var(--ink);
  }
  .btn-flip{
    grid-column:1 / -1;
    background:var(--lacquer);
    color:#fff;
  }
  .btn-speak{
  grid-column:1 / -1;
  background:var(--gold);
  color:#fff;
  }
  .btn-tone-toggle{
    grid-column:1 / -1;
    background:#7a5c9e;
    color:#fff;
  }
  .tone-panel{
    display:none;
    width:100%;
    max-width:520px;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-bottom:10px;
  }
  .btn-tone{
    background:var(--card-bg);
    border:1.5px solid var(--line);
    color:var(--ink);
    font-size:13px;
    line-height:1.4;
    padding:10px 6px;
  }
  .btn-tone span{
    font-size:20px;
    font-weight:800;
    color:var(--lacquer);
  }
  .btn-shuffle{
    background:var(--jade);
    color:#fff;
  }
  .btn-reset{
    background:var(--card-bg);
    border:1.5px solid var(--line);
    color:#9b9384;
  }
  @media (max-width:380px){
    .front-text{ font-size:15vw !important; }
  }
</style>
</head>
<body>

<header>
  <div class="kicker">TIẾNG VIỆT · เสียงเทียบภาษาไทย</div>
  <h1>Flashcard เวียดนาม</h1>
</header>

<div class="controls-top">
  <select id="filterSelect"></select>
</div>

<div class="progress"><div class="progress-fill" id="progressFill"></div></div>

<div class="card-wrap">
  <div class="card" id="card" onclick="flipCard()">
    <div class="cat-label" id="catLabel"></div>
    <div class="front-text" id="frontText" style="font-size:52px;"></div>
    <div class="back-content" id="backContent">
      <div class="front-echo" id="frontEcho"></div>
      <div class="back-line" id="backLine"></div>
    </div>
    <div class="flip-hint" id="flipHint">แตะเพื่อดูคำตอบ</div>
  </div>
</div>

<div class="counter" id="counter"></div>

<div class="btn-row">
  <button class="btn-nav" onclick="prevCard()">ก่อนหน้า</button>
  <button class="btn-nav" onclick="nextCard()">ถัดไป</button>
</div>
<div class="btn-row">
  <button class="btn-flip" onclick="flipCard()">พลิกการ์ด</button>
</div>
<div class="btn-row">
  <button class="btn-speak" onclick="speakWord()">ฟังเสียง</button>
</div>
<div class="btn-row">
  <button class="btn-tone-toggle" onclick="toggleTonePanel()">ฝึกวรรณยุกต์</button>
</div>
<div id="tonePanel" class="tone-panel">
  <button class="btn-tone" onclick="speakTone(0)">Ngang (a)<br><span id="toneVariant0">-</span></button>
  <button class="btn-tone" onclick="speakTone(1)">Huyền (à)<br><span id="toneVariant1">-</span></button>
  <button class="btn-tone" onclick="speakTone(2)">Hỏi (à)<br><span id="toneVariant2">-</span></button>
  <button class="btn-tone" onclick="speakTone(3)">Sắc (á)<br><span id="toneVariant3">-</span></button>
  <button class="btn-tone" onclick="speakTone(4)">Ngã (ã)<br><span id="toneVariant4">-</span></button>
  <button class="btn-tone" onclick="speakTone(5)">Nặng (ạ)<br><span id="toneVariant5">-</span></button>
</div>
<div class="btn-row secondary">
  <button class="btn-shuffle" onclick="shuffleCards()">สุ่ม</button>
  <button class="btn-reset" onclick="resetOrder()">เรียงใหม่</button>
</div>
<audio id="ttsAudio" style="display:none;"></audio>

function render(){
  const card = document.getElementById('card');
  const catLabel = document.getElementById('catLabel');
  const frontText = document.getElementById('frontText');
  const backContent = document.getElementById('backContent');
  const frontEcho = document.getElementById('frontEcho');
  const backLine = document.getElementById('backLine');
  const flipHint = document.getElementById('flipHint');

  if(currentCards.length===0){

// ตารางสระ+วรรณยุกต์ครบ 6 เสียง: [ngang, huyền, hỏi, sắc, ngã, nặng]
const toneTable = {
  'a':['a','à','ả','á','ã','ạ'],
  'ă':['ă','ằ','ẳ','ắ','ẵ','ặ'],
  'â':['â','ầ','ẩ','ấ','ẫ','ậ'],
  'e':['e','è','ẻ','é','ẽ','ẹ'],
  'ê':['ê','ề','ể','ế','ễ','ệ'],
  'i':['i','ì','ỉ','í','ĩ','ị'],
  'o':['o','ò','ỏ','ó','õ','ọ'],
  'ô':['ô','ồ','ổ','ố','ỗ','ộ'],
  'ơ':['ơ','ờ','ở','ớ','ỡ','ợ'],
  'u':['u','ù','ủ','ú','ũ','ụ'],
  'ư':['ư','ừ','ử','ứ','ữ','ự'],
  'y':['y','ỳ','ỷ','ý','ỹ','ỵ'],
};
const toneNames = ['Ngang','Huyền','Hỏi','Sắc','Ngã','Nặng'];

// map ย้อนกลับ: ตัวอักษรใดๆ (มีวรรณยุกต์หรือไม่ก็ตาม) -> [สระฐาน, index วรรณยุกต์]
const charToBase = {};
Object.entries(toneTable).forEach(([base, variants])=>{
  variants.forEach((ch, i)=>{ charToBase[ch] = [base, i]; });
});

// สร้างคำแปรผันตามวรรณยุกต์ที่เลือก (ใช้กับพยางค์แรกที่เจอสระมีวรรณยุกต์)
function applyTone(word, toneIdx){
  const tokens = word.split(' ');
  const firstToken = tokens[0];
  const chars = [...firstToken];

  // หาตำแหน่งสระตัวสุดท้ายในพยางค์แรกที่อยู่ในตาราง
  let targetIdx = -1;
  for(let i = chars.length - 1; i >= 0; i--){
    const lower = chars[i].toLowerCase();
    if(charToBase[lower]){ targetIdx = i; break; }
  }
  if(targetIdx === -1) return word; // ไม่เจอสระที่รู้จัก คืนคำเดิม

  const lowerChar = chars[targetIdx].toLowerCase();
  const [base] = charToBase[lowerChar];
  let newChar = toneTable[base][toneIdx];
  if(chars[targetIdx] !== lowerChar) newChar = newChar.toUpperCase();
  chars[targetIdx] = newChar;

  tokens[0] = chars.join('');
  return tokens.join(' ');
}

function updateTonePanel(){
  if(currentCards.length===0) return;
  const word = currentCards[idx].viet;
  if(!word) return;
  for(let i=0; i<6; i++){
    const variant = applyTone(word, i);
    const el = document.getElementById('toneVariant'+i);
    if(el) el.textContent = variant;
  }
}

let vietVoice = null;

function loadVietVoice(){
  const voices = speechSynthesis.getVoices();
  vietVoice = voices.find(v => v.lang === 'vi-VN')
           || voices.find(v => v.lang.startsWith('vi'))
           || null;
}

// โหลดทันทีถ้ามีอยู่แล้ว และโหลดซ้ำเมื่อรายชื่อเสียงพร้อม
loadVietVoice();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVietVoice;
}

function playVietnamese(text){
  const audio = document.getElementById('ttsAudio');
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q='
            + encodeURIComponent(text)
            + '&tl=vi&client=tw-ob';
  audio.src = url;
  audio.play().catch(()=>{
    // สำรอง: ถ้า Google TTS ใช้ไม่ได้ ให้กลับไปใช้เสียงเครื่อง
    fallbackSpeak(text);
  });
}

function fallbackSpeak(text){
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'vi-VN';
  utter.rate = 0.85;
  if (vietVoice) utter.voice = vietVoice;
  speechSynthesis.speak(utter);
}

function speakWord(){
  if(currentCards.length===0) return;
  const word = currentCards[idx].viet;
  if(!word) return;
  playVietnamese(word);
}

function speakTone(toneIdx){
  if(currentCards.length===0) return;
  const word = currentCards[idx].viet;
  if(!word) return;
  const variant = applyTone(word, toneIdx);
  playVietnamese(variant);
}

function toggleTonePanel(){
  const panel = document.getElementById('tonePanel');
  panel.style.display = panel.style.display === 'grid' ? 'none' : 'grid';
}
  
function flipCard(){
  if(currentCards.length===0) return;
  flipped = !flipped;
  render();
}

function nextCard(){
  if(currentCards.length===0) return;
  idx = (idx+1) % currentCards.length;
  flipped = false;
  render();
}

function prevCard(){
  if(currentCards.length===0) return;
  idx = (idx-1+currentCards.length) % currentCards.length;
  flipped = false;
  render();
}

function shuffleCards(){
  for(let i=currentCards.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentCards[i],currentCards[j]] = [currentCards[j],currentCards[i]];
  }
  idx = 0; flipped = false;
  render();
}

function resetOrder(){
  const f = filterSelect.value;
  currentCards = f === "ทั้งหมด" ? [...allCards] : allCards.filter(c=>c.cat===f);
  idx = 0; flipped = false;
  render();
}

render();
