<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard ภาษาจีน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --ink:#2b2320; --accent:#c0392b; --accent2:#1e6f5c;
    --muted:#8a7f76; --line:#e7ddd0; --soft:#f6ede0; --chip:#ffffff; --shadow:rgba(0,0,0,0.08);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1917; --card:#27231f; --ink:#f1ebe4; --accent:#ec7a6c; --accent2:#5cc4a6;
      --muted:#a39a90; --line:#3b352f; --soft:#312b26; --chip:#27231f; --shadow:rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1917; --card:#27231f; --ink:#f1ebe4; --accent:#ec7a6c; --accent2:#5cc4a6;
    --muted:#a39a90; --line:#3b352f; --soft:#312b26; --chip:#27231f; --shadow:rgba(0,0,0,0.35);
  }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:'Sarabun','Noto Sans SC','Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:16px 14px 28px; min-height:100%;
  }
  .cn, .hz{ font-family:'Noto Sans SC',sans-serif; }
  header{ text-align:center; margin-bottom:10px; }
  header h1{ font-size:1.4rem; margin:0; letter-spacing:1px; }
  header h1 .cn{ color:var(--accent); font-weight:700; }
  header p{ margin:2px 0 0; color:var(--muted); font-size:0.85rem; }

  .wrap{ width:100%; max-width:460px; }
  select{
    width:100%; font-family:inherit; font-size:15px; padding:11px 12px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--chip); color:var(--ink);
  }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
  .chip{
    font-family:inherit; font-size:13px; padding:7px 13px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--chip); color:var(--ink); cursor:pointer;
  }
  .chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip .cn{ font-weight:700; margin-right:3px; }
  .chip:focus-visible, button:focus-visible, select:focus-visible, .card:focus-visible{ outline:3px solid var(--accent2); outline-offset:2px; }

  .progress-wrap{ height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:12px 0 6px; }
  .progress-bar{ height:100%; background:var(--accent2); width:0%; transition:width .2s; }
  .counter{ color:var(--muted); font-size:0.8rem; margin-bottom:8px; text-align:center; }

  .card{ width:100%; height:430px; perspective:1200px; cursor:pointer; margin-bottom:14px; }
  .card.short{ height:300px; }
  .card-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  @media (prefers-reduced-motion: reduce){ .card-inner{ transition:none; } }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:18px; background:var(--card); box-shadow:0 6px 18px var(--shadow);
    border:1px solid var(--line); padding:18px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .back{ transform:rotateY(180deg); justify-content:flex-start; padding-top:40px; }
  .cat-tag{
    position:absolute; top:12px; left:14px; right:14px; text-align:left;
    font-size:0.7rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cat-tag span{ background:var(--soft); padding:3px 10px; border-radius:12px; }
  .front-text{ font-size:56px; font-weight:800; color:var(--accent); line-height:1.15; word-break:break-word; }
  .front-text.hz{ font-family:'Noto Serif SC','Noto Sans SC',serif; font-weight:900; color:var(--ink); letter-spacing:4px; }
  .flip-hint{ position:absolute; bottom:12px; font-size:12px; color:var(--muted); }

  /* pinyin back */
  .b-cn{ font-family:'Noto Sans SC',sans-serif; font-size:34px; font-weight:700; margin-bottom:6px; }
  .b-th{ font-size:20px; font-weight:600; color:var(--accent2); margin-bottom:8px; }
  .b-desc{ font-size:14px; line-height:1.6; overflow-y:auto; padding:0 4px; }

  /* vocab back */
  .scroll{ width:100%; overflow-y:auto; text-align:left; padding-right:4px; flex:1; }
  .v-top{ text-align:center; margin-bottom:10px; }
  .v-hz{ font-family:'Noto Serif SC',serif; font-weight:900; font-size:30px; }
  .v-trad{ font-size:13px; color:var(--muted); margin-left:6px; font-family:'Noto Sans SC',sans-serif; font-weight:500; }
  .v-py{ font-size:22px; font-weight:700; color:var(--accent); margin-top:2px; }
  .v-th{ font-size:16px; color:var(--accent2); font-weight:600; }
  .v-mean{ font-size:19px; font-weight:700; margin-top:6px; }
  .pos{ display:inline-block; font-size:12px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:0 6px; margin-right:6px; vertical-align:2px; }
  .sec{ border-top:1px dashed var(--line); padding:8px 0 6px; font-size:14px; line-height:1.65; }
  .sec h4{ margin:0 0 2px; font-size:12px; color:var(--muted); font-weight:700; }
  .ex{ margin:3px 0; }
  .ex .cn{ font-weight:700; }
  .ex .t{ color:var(--muted); display:block; font-size:13px; }

  .controls{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px; }
  button.ctrl{
    font-family:inherit; font-size:0.9rem; font-weight:600; padding:12px 8px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--chip); color:var(--ink); cursor:pointer;
  }
  button.ctrl.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ctrl.listen{ background:var(--accent2); border-color:var(--accent2); color:#fff; }
  button.ctrl.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  button.ctrl:active{ opacity:.7; }

  .matrix-wrap{
    width:100%; max-width:900px; overflow-x:auto; background:var(--card);
    border-radius:14px; padding:12px; box-shadow:0 4px 14px var(--shadow);
  }
  table.pinyin-matrix{ border-collapse:collapse; font-size:0.78rem; width:100%; }
  table.pinyin-matrix th, table.pinyin-matrix td{ border:1px solid var(--line); padding:5px 6px; text-align:center; white-space:nowrap; }
  table.pinyin-matrix th{ background:var(--soft); position:sticky; top:0; }
  table.pinyin-matrix td.valid{ cursor:pointer; }
  table.pinyin-matrix td.empty{ background:var(--soft); color:var(--line); }
  .matrix-note{ font-size:0.78rem; color:var(--muted); margin-top:8px; line-height:1.5; }
  footer{ margin-top:18px; font-size:0.72rem; color:var(--muted); text-align:center; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<header>
  <h1>中文 <span class="cn">Flashcard</span></h1>
  <p>พินอินและคำศัพท์ภาษาจีน</p>
</header>

<div class="wrap">
  <select id="groupSelect" aria-label="เลือกหมวด">
    <option value="vocab">词汇 คำศัพท์</option>
    <option value="pinyin">拼音 ระบบเสียงพินอิน</option>
  </select>
  <div class="chips" id="chips"></div>
</div>

<div class="wrap" id="flashcardView">
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="counter" id="counterText"></div>

  <div class="card" id="card" tabindex="0" role="button" aria-label="พลิกการ์ด">
    <div class="card-inner">
      <div class="face front">
        <div class="cat-tag"><span id="catFront"></span></div>
        <div class="front-text" id="frontText"></div>
        <div class="flip-hint">แตะเพื่อดูคำตอบ</div>
      </div>
      <div class="face back" id="backFace">
        <div class="cat-tag"><span id="catBack"></span></div>
        <div id="backBody" class="scroll"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" id="prevBtn">‹ ก่อนหน้า</button>
    <button class="ctrl primary" id="flipBtn">พลิกการ์ด</button>
    <button class="ctrl" id="nextBtn">ถัดไป ›</button>
  </div>
  <div class="controls">
    <button class="ctrl listen" id="listenBtn">ฟังเสียง</button>
    <button class="ctrl" id="shuffleBtn">สุ่ม</button>
    <button class="ctrl" id="resetBtn">เรียงใหม่</button>
  </div>
  <div class="controls" id="extraRow">
    <button class="ctrl" id="reverseBtn" style="grid-column:1 / 3">โหมดกลับด้าน (ไทย → จีน)</button>
    <button class="ctrl" id="matrixBtn">ตารางเสียง</button>
  </div>
</div>

<div class="matrix-wrap hidden" id="matrixView">
  <div id="matrixContainer"></div>
  <div class="matrix-note">
    แตะช่องเพื่อฟังเสียง · เลื่อนซ้าย-ขวาเพื่อดูคอลัมน์ที่เหลือ · <b>-i[ɿ]</b> ใช้เฉพาะหลัง z c s และ <b>-i[ʅ]</b> ใช้เฉพาะหลัง zh ch sh r
  </div>
  <div style="margin-top:10px"><button class="ctrl" id="matrixBackBtn">กลับไปหน้าการ์ด</button></div>
</div>

<footer>ทำโดย นีโม่ · อิงตามหนังสือเรียน</footer>

<script>
// ============================================================
// 拼音 ระบบเสียงพินอิน (ข้อมูลเดิม)
// ============================================================
const pinyinCards = [];
function addPy(cat, list, opt={}){
  list.forEach(x=>pinyinCards.push({
    type:"py", cat, front:x.front,
    cn: opt.noCn ? "" : (x.cn || x.front.replace(/ \[.*|\s*\(.*/,'')),
    th:x.th, desc:x.desc,
    speak: opt.noSpeak ? null : x.front.split(" ")[0]
  }));
}

addPy("声母 พยัญชนะต้น", [
  {front:"b", th:"ป (ไม่มีลม)", desc:"ริมฝีปากบน-ล่างประกบกันแน่นแล้วปล่อยลมออกทันที ไม่มีลมพ่นแรง เทียบเสียง ป ไทย"},
  {front:"p", th:"พ (มีลม)", desc:"ริมฝีปากบน-ล่างประกบกันเหมือน b แต่ปล่อยลมพ่นแรง เทียบเสียง พ ไทย"},
  {front:"m", th:"ม (นาสิก)", desc:"ริมฝีปากประกบกัน ปล่อยเสียงออกทางจมูก เทียบเสียง ม ไทย"},
  {front:"f", th:"ฟ (เสียดแทรก)", desc:"ฟันบนแตะริมฝีปากล่าง ปล่อยลมเสียดแทรกออกมา เทียบเสียง ฟ ไทย"},
  {front:"d", th:"ต (ไม่มีลม)", desc:"ปลายลิ้นแตะปุ่มเหงือก ปล่อยลมออกทันทีไม่มีลมแรง เทียบเสียง ต ไทย"},
  {front:"t", th:"ท (มีลม)", desc:"ปลายลิ้นแตะปุ่มเหงือกเหมือน d แต่ปล่อยลมพ่นแรง เทียบเสียง ท ไทย"},
  {front:"n", th:"น (นาสิก)", desc:"ปลายลิ้นแตะปุ่มเหงือก ปล่อยเสียงออกทางจมูก เทียบเสียง น ไทย"},
  {front:"l", th:"ล", desc:"ปลายลิ้นแตะปุ่มเหงือก ลมออกด้านข้างลิ้นทั้งสองข้าง เทียบเสียง ล ไทย"},
  {front:"g", th:"ก (ไม่มีลม)", desc:"โคนลิ้นแตะเพดานอ่อน ปล่อยลมออกทันที เทียบเสียง ก ไทย"},
  {front:"k", th:"ข (มีลม)", desc:"โคนลิ้นแตะเพดานอ่อนเหมือน g แต่ปล่อยลมพ่นแรง เทียบเสียง ข ไทย"},
  {front:"h", th:"ฮ (เสียดแทรก)", desc:"โคนลิ้นเข้าใกล้เพดานอ่อน ลมเสียดแทรกผ่านออกมา เทียบเสียง ฮ ไทย"},
  {front:"j", th:"จ (ลิ้นแบน ไม่มีลม)", desc:"กลางลิ้นแตะเพดานแข็ง ลิ้นแบนราบ ไม่ม้วน ไม่มีลมพ่นแรง ใช้กับสระ i/ü เท่านั้น"},
  {front:"q", th:"ช (ลิ้นแบน มีลม)", desc:"ตำแหน่งลิ้นเหมือน j แต่ปล่อยลมพ่นแรง ใช้กับสระ i/ü เท่านั้น"},
  {front:"x", th:"ซ/ช (เสียดแทรก)", desc:"กลางลิ้นเข้าใกล้เพดานแข็ง ลมเสียดแทรก ลิ้นแบน ใช้กับสระ i/ü เท่านั้น"},
  {front:"z", th:"จ (ลิ้นแบน ไม่มีลม)", desc:"ปลายลิ้นแตะหลังฟันบน ลิ้นแบนไม่ม้วน ไม่มีลมพ่นแรง ต่างจาก zh ตรงที่ไม่ม้วนลิ้น"},
  {front:"c", th:"ช (ลิ้นแบน มีลม)", desc:"ตำแหน่งลิ้นเหมือน z แต่ปล่อยลมพ่นแรง ลิ้นแบนไม่ม้วน"},
  {front:"s", th:"ซ (เสียดแทรก)", desc:"ปลายลิ้นใกล้หลังฟันบน ลิ้นแบนไม่ม้วน ลมเสียดแทรกออกมา"},
  {front:"zh", th:"จ ม้วนลิ้น (ไม่มีลม)", desc:"ปลายลิ้นม้วนขึ้นแตะปุ่มเหงือกส่วนหลัง ไม่มีลมพ่นแรง ฟังคล้าย z แต่ลิ้นม้วน"},
  {front:"ch", th:"ช ม้วนลิ้น (มีลม)", desc:"ตำแหน่งลิ้นเหมือน zh แต่ปล่อยลมพ่นแรง ฟังคล้าย c แต่ลิ้นม้วน"},
  {front:"sh", th:"ช/ซ ม้วนลิ้น (เสียดแทรก)", desc:"ปลายลิ้นม้วนใกล้ปุ่มเหงือกส่วนหลัง ลมเสียดแทรก ฟังคล้าย s แต่ลิ้นม้วน"},
  {front:"r", th:"ร ม้วนลิ้น (เสียงก้อง)", desc:"ตำแหน่งลิ้นใกล้เคียง sh แต่เส้นเสียงสั่น (มีเสียงก้อง) ฟังคล้าย sh ที่มีเสียงก้อง"},
]);

addPy("单韵母 สระเดี่ยว", [
  {front:"a", th:"อา", desc:"อ้าปากกว้างที่สุด ลิ้นอยู่ตำแหน่งต่ำ ไม่ห่อปาก"},
  {front:"o", th:"โอ", desc:"ริมฝีปากห่อกลม ลิ้นอยู่ตำแหน่งกึ่งสูงค่อนไปทางหลัง"},
  {front:"e", th:"เออ", desc:"ลิ้นอยู่กลางปาก ไม่ห่อปาก ตำแหน่งกึ่งสูงค่อนไปทางหลัง"},
  {front:"i", th:"อี", desc:"ยิ้มกว้าง ลิ้นอยู่ตำแหน่งสูงและอยู่ด้านหน้า"},
  {front:"u", th:"อู", desc:"ห่อปากกลมที่สุด อ้าปากน้อยที่สุด ลิ้นอยู่ตำแหน่งสูงและค่อนไปข้างหลัง"},
  {front:"ü", th:"อวี", desc:"ลิ้นอยู่ตำแหน่งสูงและค่อนไปข้างหน้าเหมือน i แต่ริมฝีปากห่อกลมเหมือน u"},
  {front:"-i [ɿ]", th:"(หลัง z c s)", desc:"ไม่ใช่เสียงสระจริง แต่เป็นการยืดเสียงพยัญชนะต้น z/c/s ต่อ ลิ้นแบนไม่ม้วน — ใช้เฉพาะหลัง z c s เท่านั้น"},
  {front:"-i [ʅ]", th:"(หลัง zh ch sh r)", desc:"เหมือน -i[ɿ] แต่ลิ้นม้วน — ใช้เฉพาะหลัง zh ch sh r เท่านั้น"},
  {front:"er", th:"เอ๋อ (ม้วนลิ้น)", desc:"ออกเสียงคล้าย e แล้วม้วนปลายลิ้นขึ้นระหว่างออกเสียง เป็นสระม้วนลิ้นเสียงเดียวที่มีในภาษาจีน"},
]);

addPy("复韵母 สระประสม", [
  {front:"ai", th:"อาย", desc:"ลิ้นอยู่หลังก่อน (a) แล้วค่อยๆ ยกสูงขึ้นไปจนถึง i คือ a→i"},
  {front:"ei", th:"เอย", desc:"ลิ้นอยู่หน้าก่อน (e) แล้วค่อยๆ ยกสูงขึ้นพร้อมหุบปากแคบลงจนถึง i คือ e→i"},
  {front:"ao", th:"อาว", desc:"ลิ้นอยู่หลังก่อน (a) แล้วค่อยๆ ยกสูงขึ้นและห่อปากกลมจนถึง o/u คือ a→o"},
  {front:"ou", th:"โอว", desc:"ริมฝีปากห่อกลมเล็กน้อยก่อน (o) แล้วค่อยๆ ห่อกลมมากขึ้นจนถึง u คือ o→u"},
]);

addPy("鼻韵母 สระประสมเสียงจมูก", [
  {front:"an", th:"อาน", desc:"ลิ้นอยู่หน้าก่อน (a) แล้วปลายลิ้นยื่นไปแตะปุ่มเหงือกออกเสียงจมูก คือ a→n"},
  {front:"en", th:"เอิน", desc:"ลิ้นอยู่กลางก่อน (e) แล้วปลายลิ้นแตะปุ่มเหงือกออกเสียงจมูก คือ e→n"},
  {front:"ang", th:"อาง", desc:"ลิ้นอยู่หลังก่อน (a) แล้วโคนลิ้นถอยไปแตะเพดานอ่อนออกเสียงจมูก คือ a→ng"},
  {front:"eng", th:"เอิง", desc:"ลิ้นอยู่กลางก่อน (e) แล้วโคนลิ้นแตะเพดานอ่อนออกเสียงจมูก คือ e→ng"},
  {front:"ong", th:"อง", desc:"ริมฝีปากห่อกลมคล้าย u ก่อน แล้วโคนลิ้นแตะเพดานอ่อนออกเสียงจมูก คือ o→ng"},
]);

addPy("复合韵母 i- สระผสมขึ้นต้นด้วย i", [
  {front:"ia", th:"เอีย", desc:"เริ่มจากลิ้นสูง (i) แล้วค่อยๆ ลดต่ำลงจนถึง a คือ i→a"},

   ex:[["小姐，那种衣服有别的颜色的吗？","น้อง เสื้อชนิดนั้นมีสีอื่นไหม?"]]},
  {part:PX4, hz:"真", py:"zhēn", th:"เจิน", mean:"จริงๆ, …จังเลย", pos:"副",
   parts:"",
   use:"真 + คุณศัพท์ = …จริงๆ",
   ex:[["这套衣服真漂亮！","เสื้อผ้าชุดนี้สวยจังเลย!"]]},
  {part:PX4, hz:"给", trad:"給", py:"gěi", th:"เก่ย", mean:"ให้", pos:"动",
   parts:"纟(ไหม) + 合 (ให้เสียง)",
   use:"给 + คน + ของ",
   ex:[["给你一百铢。","ให้เธอ 100 บาท"],["给您这套红色的。","ชุดสีแดงนี้ให้คุณดู"]]},
  {part:PX4, hz:"欢迎", trad:"歡迎", py:"huānyíng", th:"ฮวน อิ๋ง", mean:"ยินดีต้อนรับ", pos:"动",
   parts:"欢 ดีใจ + 迎 = 辶(เดิน) + 卬 → ออกไปรับ",
   use:"",
   ex:[["再见！欢迎再来。","พบกันใหม่ ยินดีต้อนรับที่คุณจะมาอีก"]]},
  {part:PX4, hz:"卖", trad:"賣", py:"mài", th:"ม่าย", mean:"ขาย", pos:"动",
   parts:"十 + 买 → เอาของที่ซื้อมาออกไปขาย",
   use:"买 mǎi (เสียง 3) = ซื้อ · 卖 mài (เสียง 4) = ขาย ฟังเสียงให้ดี",
   ex:[["卖东西的人","คนขายของ"],["你一共卖几公斤？","คุณขายไปทั้งหมดกี่กิโล?"]]},
  {part:PX4, hz:"逛", py:"guàng", th:"กว้าง", mean:"เดินเล่น, เดินชอปปิ้ง", pos:"动",
   parts:"辶(การเดิน) + 狂 (ให้เสียง)",
   use:"逛 + สถานที่ ได้เลย เช่น 逛商场 (เดินห้าง) 逛服装市场",
   ex:[["丁秀梅和李天龙一起逛服装市场。","ติงซิ่วเหมยกับหลี่เทียนหลงเดินชมตลาดเสื้อผ้าด้วยกัน"]]},
  {part:PX4, hz:"市场", trad:"市場", py:"shìchǎng", th:"ซื่อ ฉ่าง", mean:"ตลาด", pos:"名",
   parts:"市 ตลาด/เมือง + 场 = 土 + 昜 → ลาน",
   use:"商场 shāngchǎng = ห้าง · 超级市场 → ย่อเป็น 超市 chāoshì = ซูเปอร์มาร์เก็ต",
   ex:[["服装市场","ตลาดเสื้อผ้า"]]},
  {part:PX4, hz:"一起", py:"yìqǐ", th:"อี้ ฉี่", mean:"ด้วยกัน", pos:"副",
   parts:"起 = 走 (เดิน) + 己 → ลุกขึ้นเดิน",
   use:"A 跟 gēn B 一起 + กริยา = A ทำ…กับ B ด้วยกัน (跟 = กับ ใช้ 和 hé แทนได้)",
   ex:[["我们一起去买东西，好吗？","เราไปซื้อของด้วยกันดีไหม?"]]},
];

const vocabByChapter = [
  { chapter: "บทที่ 9", data: vocabL9 },
  { chapter: "บทที่ 9 เสริม", data: vocabL9Extra },
];


/* ================= STATE ================= */
const vocabCards = [];
vocabByChapter.forEach(({chapter,data})=>data.forEach(v=>vocabCards.push({type:"vocab", chapter, ...v})));

const pinyinCats = [...new Set(pinyinCards.map(c=>c.cat))];
const vocabChapters = vocabByChapter.map(v=>v.chapter);

let group = "vocab";
let sub = "ทั้งหมด";
let currentCards = [];
let idx = 0;
let reverse = false;

const $ = id => document.getElementById(id);
const cardEl = $('card');

function pool(){
  if(group === "pinyin") return sub==="ทั้งหมด" ? pinyinCards.slice() : pinyinCards.filter(c=>c.cat===sub);
  return sub==="ทั้งหมด" ? vocabCards.slice() : vocabCards.filter(c=>c.chapter===sub);
}

function renderChips(){
  const list = ["ทั้งหมด", ...(group==="pinyin" ? pinyinCats : vocabChapters)];
  $('chips').innerHTML = list.map(name=>{
    let label = name;
    const m = name.match(/^([^\sก-๙]+)\s(.+)$/);
    if(group==="pinyin" && m) label = `<span class="cn">${m[1]}</span>${m[2]}`;
    return `<button class="chip${name===sub?' active':''}" data-sub="${name}">${label}</button>`;
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{ sub=b.dataset.sub; load(); }));
  $('reverseBtn').classList.toggle('hidden', group!=="vocab");
  $('matrixBtn').classList.toggle('hidden', group!=="pinyin");
  $('reverseBtn').style.gridColumn = "1 / 4";
  if(group==="pinyin") $('matrixBtn').style.gridColumn = "1 / 4";
}

function load(){
  currentCards = pool(); idx = 0;
  renderChips(); render();
}

function frontSize(t){
  const n = [...t].length;
  if(n<=2) return 88; if(n<=3) return 72; if(n<=4) return 60; return 46;
}

function vocabBack(c){
  const sec = (title, body) => body ? `<div class="sec"><h4>${title}</h4>${body}</div>` : "";
  const ex = (c.ex||[]).map(([z,t])=>`<div class="ex"><span class="cn">${z}</span><span class="t">${t}</span></div>`).join('');
  return `
    <div class="v-top">
      <div class="v-hz">${c.hz}${c.trad?`<span class="v-trad">繁 ${c.trad}</span>`:""}</div>
      <div class="v-py">${c.py}</div>
      <div class="v-th">${c.th}</div>
      <div class="v-mean">${c.pos?`<span class="pos">${c.pos}</span>`:""}${c.mean}</div>
    </div>
    ${sec("ส่วนประกอบตัวอักษร", c.parts)}
    ${sec("วิธีใช้", c.use)}
    ${sec("ตัวอย่าง", ex)}`;
}

function render(){
  cardEl.classList.remove('flipped');
  const n = currentCards.length;
  if(!n){ $('frontText').textContent="ยังไม่มีการ์ดในหมวดนี้"; $('backBody').innerHTML=""; return; }
  const c = currentCards[idx];
  const f = $('frontText');
  cardEl.classList.toggle('short', c.type==="py");

  if(c.type==="vocab"){
    const tag = `${c.chapter} · ${c.part}`;
    $('catFront').textContent = tag; $('catBack').textContent = tag;
    if(reverse){
      f.className = "front-text"; f.style.fontSize = "30px"; f.style.color = "var(--ink)";
      f.innerHTML = `${c.mean}${c.pos?`<div style="font-size:14px;color:var(--muted);margin-top:8px">${c.pos}</div>`:""}`;
    } else {
      f.className = "front-text hz"; f.style.color = ""; f.style.fontSize = frontSize(c.hz)+"px";
      f.textContent = c.hz;
    }
    $('backBody').className = "scroll";
    $('backBody').innerHTML = vocabBack(c);
  } else {
    $('catFront').textContent = c.cat; $('catBack').textContent = c.cat;
    f.className = "front-text"; f.style.color=""; f.style.fontSize = ([...c.front].length>6?"34px":"56px");
    f.textContent = c.front;
    $('backBody').className = "scroll";
    $('backBody').innerHTML = `<div style="text-align:center"><div class="b-cn">${c.cn||""}</div><div class="b-th">${c.th||""}</div><div class="b-desc">${c.desc||""}</div></div>`;
  }
  $('backBody').scrollTop = 0;
  $('counterText').textContent = `${idx+1} / ${n}`;
  $('progressBar').style.width = `${((idx+1)/n)*100}%`;
}

function flipCard(){ cardEl.classList.toggle('flipped'); }
function nextCard(){ if(!currentCards.length) return; idx=(idx+1)%currentCards.length; render(); }
function prevCard(){ if(!currentCards.length) return; idx=(idx-1+currentCards.length)%currentCards.length; render(); }
function shuffleCards(){
  for(let i=currentCards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [currentCards[i],currentCards[j]]=[currentCards[j],currentCards[i]]; }
  idx=0; render();
}

/* ================= TTS ================= */
let zhVoice = null;
function loadVoices(){
  const v = speechSynthesis.getVoices();
  zhVoice = v.find(x=>x.lang==='zh-CN') || v.find(x=>x.lang && x.lang.replace('_','-').startsWith('zh-CN')) || v.find(x=>x.lang && x.lang.startsWith('zh')) || null;
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!text || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.8; if(zhVoice) u.voice=zhVoice;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function speakCurrent(){
  const c = currentCards[idx]; if(!c) return;
  if(c.type==="vocab") speak(c.hz.replace(/…/g,''));
  else if(c.speak) speak(c.speak);
}

/* ================= MATRIX ================= */
function renderMatrix(){
  let html = `<table class="pinyin-matrix"><thead><tr><th></th>${matrixCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  matrixRows.forEach(r=>{
    html += `<tr><th>${r}</th>` + (matrixData[r]||[]).map(v=> v?`<td class="valid" data-s="${v}">${v}</td>`:`<td class="empty">—</td>`).join('') + `</tr>`;
  });
  $('matrixContainer').innerHTML = html + `</tbody></table>`;
  $('matrixContainer').querySelectorAll('td.valid').forEach(td=>td.addEventListener('click',()=>speak(td.dataset.s)));
}
function showMatrix(on){
  $('flashcardView').classList.toggle('hidden', on);
  $('matrixView').classList.toggle('hidden', !on);
  if(on) renderMatrix();
}

/* ================= EVENTS ================= */
$('groupSelect').addEventListener('change', e=>{ group=e.target.value; sub="ทั้งหมด"; showMatrix(false); load(); });
cardEl.addEventListener('click', flipCard);
$('flipBtn').addEventListener('click', flipCard);
$('nextBtn').addEventListener('click', nextCard);
$('prevBtn').addEventListener('click', prevCard);
$('shuffleBtn').addEventListener('click', shuffleCards);
$('resetBtn').addEventListener('click', load);
$('listenBtn').addEventListener('click', speakCurrent);
$('reverseBtn').addEventListener('click', ()=>{ reverse=!reverse; $('reverseBtn').classList.toggle('on', reverse); render(); });
$('matrixBtn').addEventListener('click', ()=>showMatrix(true));
$('matrixBackBtn').addEventListener('click', ()=>showMatrix(false));
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') nextCard();
  else if(e.key==='ArrowLeft') prevCard();
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipCard(); }
  else if(e.key==='s') speakCurrent();
});

load();
</script>
</body>
</html>
